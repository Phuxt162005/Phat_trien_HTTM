[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project01-diabetes-mas"
version = "0.1.0"
description = "Hybrid Multi-Agent System for Diabetes Decision Support"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "joblib>=1.3", "matplotlib>=3.8", "imbalanced-learn>=0.12"]
neo4j = ["neo4j>=5.20"]
rag = ["sentence-transformers>=2.7", "pypdf>=4.2", "beautifulsoup4>=4.12", "rank-bm25>=0.2"]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "pydantic>=2.7"]
test = ["pytest>=8.2"]
all = ["torch>=2.2", "joblib>=1.3", "matplotlib>=3.8", "imbalanced-learn>=0.12", "neo4j>=5.20", "sentence-transformers>=2.7", "pypdf>=4.2", "beautifulsoup4>=4.12", "rank-bm25>=0.2", "fastapi>=0.111", "uvicorn[standard]>=0.30", "pydantic>=2.7", "pytest>=8.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
