# Keep the three official datasets separate; never merge them implicitly.
# Place the original CSV files in data/raw/ without modifying their contents.
datasets:
  diabetes01:
    file: diabetes01.csv
    target: diabetes
    task: binary_classification
    has_target: true
    excluded_features: []
    role: original_supervised
  diabetes02:
    file: diabetes02.csv
    target: null
    task: unlabeled_health_tabular
    has_target: false
    excluded_features: []
    role: external_unlabeled
  diabetes04:
    file: diabetes04.csv
    target: Diabetes_012
    task: multiclass_classification
    has_target: true
    excluded_features: []
    role: original_supervised

# Duplicates are reported for review; no rows are removed automatically.
duplicate_policy: report_only
